<style>

.app{max-width:1100px;margin:auto;padding:14px 14px 105px}.hero,.toolbar,.card,.library{background:#fffdfb;border:1px solid #e7ded6;border-radius:20px}
.hero{padding:20px;background:linear-gradient(135deg,#fffdfb,#f8eeea)}.brand{font-size:11px;letter-spacing:.18em;font-weight:800;color:#c98f78}h1{font-size:25px;margin:6px 0}.muted{color:#71808a;font-size:12px}
button{border:0;border-radius:10px;padding:10px 12px;font-weight:750;font-size:11px;white-space:nowrap;background:#dcebf0;color:#527d91;cursor:pointer}
button.primary{background:#527d91;color:white}button.terra{background:#f0ddd4;color:#8d5e4d}button.danger{background:#f7e5e5;color:#9b5151}
.homebar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:14px 0}.homebar h2{margin:0}.programs{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.program-card{background:#fffdfb;border:1px solid #e7ded6;border-radius:18px;padding:16px}.program-card h3{margin:0 0 5px;font-size:17px}.program-card .actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:13px}

.weektabs,.daytabs{display:flex;gap:7px;overflow:auto;margin:12px 0}.weektab.active,.daytab.active{background:#527d91;color:white}.weekbar{background:#fffdfb;border:1px solid #e7ded6;border-radius:16px;padding:10px;margin:12px 0}.weeklabel{font-size:9px;font-weight:800;color:#71808a;letter-spacing:.12em;margin-bottom:6px}.daytop{display:flex;gap:8px;align-items:center;margin:16px 0 9px}.daytop input{font-size:18px;font-weight:800}
.block{background:#fffdfb;border:1px solid #e7ded6;border-radius:18px;overflow:hidden;margin:10px 0}.block.mob{border-color:#cddfe6}.blockhead{display:flex;gap:8px;align-items:center;padding:10px;background:linear-gradient(90deg,#f0ddd4,#fff)}.mob .blockhead{background:linear-gradient(90deg,#dcebf0,#fff)}
.blockhead input{font-weight:800;background:transparent;border:0;padding:4px}.blockhead .actions{display:flex;gap:4px;margin-left:auto}.exercise{padding:10px;border-top:1px solid #e7ded6}.grid{display:grid;grid-template-columns:1.3fr .45fr .8fr .65fr .8fr 1.2fr;gap:6px}.grid .video{grid-column:1/-1}
.exactions{display:flex;justify-content:flex-end;gap:5px;margin-top:7px}.addrow{padding:10px}.bottom{position:fixed;bottom:0;left:0;right:0;background:#fffdfbf2;border-top:1px solid #e7ded6;padding:9px 14px calc(9px + env(safe-area-inset-bottom));display:flex;justify-content:center;gap:8px;z-index:20}
.toast{position:fixed;left:50%;bottom:78px;transform:translateX(-50%);background:#24313a;color:white;padding:9px 14px;border-radius:20px;font-size:11px;display:none;z-index:30}
#editorView{display:none}.back{margin-bottom:10px}
@media(max-width:720px){.programs{grid-template-columns:1fr}.meta{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr 1fr}.grid .name,.grid .cue,.grid .video{grid-column:1/-1}.daytop{align-items:flex-start;flex-direction:column}.daytop input{font-size:16px}}
</style></head><body><main class="app">
<section id="homeView">
<section class="hero"><div class="brand">CREADOR DE PROGRAMAS</div><h1>TRAINING LUIS QUIRÓS</h1><div class="muted">Crea, guarda y administra los programas de tus clientes desde un solo lugar.</div></section>
<div class="homebar"><div><h2>Mis programas</h2><div class="muted" id="count"></div></div><button class="primary" onclick="newProgram()">＋ Nuevo programa</button></div>

</section>
<section id="editorView">
<button class="back" onclick="goHome()">← Mis programas</button>
<section class="hero"><div class="brand">EDITANDO PROGRAMA</div><h1>TRAINING LUIS QUIRÓS</h1><div class="muted">Los cambios se guardan en este navegador.</div>
<div class="meta"><div class="field"><label>CLIENTE</label><input id="client"></div><div class="field"><label>OBJETIVO</label><input id="objective"></div><div class="field"><label>PROGRAMA</label><input id="program"></div><div class="field"><label>FRECUENCIA</label><input id="frequency"></div><div class="field"><label>INICIO</label><input id="start"></div><div class="field"><label>OBSERVACIÓN GENERAL</label><input id="note"></div></div></section>
<section class="toolbar"><button class="terra" onclick="addWeek()">＋ Semana</button><button onclick="duplicateWeek()">⧉ Duplicar semana</button><button class="danger" onclick="deleteWeek()">Eliminar semana</button><button onclick="addDay()">＋ Día</button><button onclick="addBlock('mobility')">＋ Movilidad</button><button onclick="addBlock('normal')">＋ Bloque</button><button onclick="duplicateDay()">⧉ Duplicar día</button><button class="danger" onclick="deleteDay()">Eliminar día</button></section>

</section></main>

erior pelvic tilt", "sets": "3", "reps": "30 s por lado", "intensity": "Control", "rest": "Por sensaciones", "cue": "Mantener retroversión durante el estiramiento.", "video": ""}, {"name": "Plancha de Isi + respiración", "sets": "3", "reps": "5 respiraciones", "intensity": "Control", "rest": "Por sensaciones", "cue": "Controlar pelvis y caja torácica.", "video": ""}]}, {"title": "CUELLO + POSTURA", "type": "normal", "exercises": [{"name": "Chin tucks", "sets": "3", "reps": "8–10 reps · 5 s", "intensity": "Suave", "rest": "Por sensaciones", "cue": "Controlado.", "video": ""}, {"name": "Isométrico cervical frontal y laterales", "sets": "3", "reps": "15–20 s / dirección", "intensity": "Suave", "rest": "Por sensaciones", "cue": "Sin forzar.", "video": ""}, {"name": "Wall slides", "sets": "3", "reps": "10–12 reps", "intensity": "Control", "rest": "Por sensaciones", "cue": "Priorizar postura.", "video": ""}]}]}, {"title": "DÍA 4 · REPITE DÍA 1", "blocks": [{"title": "MOVILIDAD ACTIVA · INICIO", "type": "mobility", "exercises": [{"name": "", "sets": "", "reps": "", "intensity": "", "rest": "", "cue": "", "video": ""}, {"name": "", "sets": "", "reps": "", "intensity": "", "rest": "", "cue": "", "video": ""}, {"name": "", "sets": "", "reps": "", "intensity": "", "rest": "", "cue": "", "video": ""}, {"name": "", "sets": "", "reps": "", "intensity": "", "rest": "", "cue": "", "video": ""}]}, {"title": "MÉTODO DE FUERZA", "type": "normal", "exercises": [{"name": "Sentadilla · secuencia", "sets": "1", "reps": "3×5 lb → 1×15 lb → 2×10 lb", "intensity": "—", "rest": "Por sensaciones", "cue": "Buena técnica.", "video": ""}, {"name": "Sentadilla", "sets": "3", "reps": "5 reps · 25 lb", "intensity": "—", "rest": "Por sensaciones", "cue": "Controlar el movimiento.", "video": "https://youtu.be/okUCXiGCESA?si=j9EloVCIcXgqFUQz"}]}, {"title": "HIPERTROFIA · 3 RONDAS", "type": "normal", "exercises": [{"name": "Press de pecho", "sets": "3", "reps": "10 reps", "intensity": "RIR 2", "rest": "Por sensaciones", "cue": "Seguido del press cerrado.", "video": ""}, {"name": "Press cerrado con KB", "sets": "3", "reps": "8 reps · 25 lb", "intensity": "—", "rest": "Por sensaciones", "cue": "", "video": ""}]}, {"title": "FINAL", "type": "normal", "exercises": [{"name": "Sentadilla isométrica", "sets": "3", "reps": "20–30 s", "intensity": "—", "rest": "Por sensaciones", "cue": "", "video": ""}]}]}, {"title": "DÍA 5 · REPITE DÍA 2", "blocks": [{"title": "MOVILIDAD ACTIVA · INICIO", "type": "mobility", "exercises": [{"name": "", "sets": "", "reps": "", "intensity": "", "rest": "", "cue": "", "video": ""}, {"name": "", "sets": "", "reps": "", "intensity": "", "rest": "", "cue": "", "video": ""}, {"name": "", "sets": "", "reps": "", "intensity": "", "rest": "", "cue": "", "video": ""}, {"name": "", "sets": "", "reps": "", "intensity": "", "rest": "", "cue": "", "video": ""}]}, {"title": "FUERZA · 3 RONDAS", "type": "normal", "exercises": [{"name": "Peso muerto con KB", "sets": "3", "reps": "8 reps · 25 lb", "intensity": "—", "rest": "Por sensaciones", "cue": "", "video": ""}, {"name": "Curl martillo + press de hombro", "sets": "3", "reps": "12 reps", "intensity": "—", "rest": "Por sensaciones", "cue": "1 rep = curl martillo + press completo.", "video": ""}]}, {"title": "CARDIO", "type": "normal", "exercises": [{"name": "Escaladora", "sets": "—", "reps": "Libre", "intensity": "Libre", "rest": "Por sensaciones", "cue": "", "video": ""}]}]}]};
const KEY='tlq_programs_v2';
let programs=[], data=null, currentWeek=0, current=0, editingId=null;
function clone(x){return JSON.parse(JSON.stringify(x))}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function blankProgram(){return{id:uid(),client:'Cliente nuevo',objective:'',program:'Programa inicial',frequency:'',start:'',note:'',weeks:[{title:'SEMANA 1',days:[{title:'DÍA 1',blocks:[{title:'MOVILIDAD ACTIVA · INICIO',type:'mobility',exercises:[blankEx()]}]}]}],updated:Date.now()}}
function normalizeProgram(p){
 if(!p.weeks){p.weeks=[{title:'SEMANA 1',days:p.days||[]}];delete p.days}
 if(!p.weeks.length)p.weeks=[{title:'SEMANA 1',days:[]}];
 p.weeks.forEach((w,i)=>{if(!w.title)w.title='SEMANA '+(i+1);if(!Array.isArray(w.days))w.days=[]});
 return p
}
function week(){return data.weeks[currentWeek]}
function days(){return week().days}
function loadLibrary(){
 try{programs=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){programs=[]}
 programs=programs.map(normalizeProgram);
 if(!programs.length){
   let legacy=null; try{legacy=JSON.parse(localStorage.getItem('tlq_program')||'null')}catch(e){}
   let m=normalizeProgram(legacy||clone(ORIGINAL)); m.id=uid(); m.updated=Date.now(); programs=[m]; persist();
 }
 renderHome();
}
function persist(){localStorage.setItem(KEY,JSON.stringify(programs))}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function toast(s){let t=document.getElementById('toast');t.textContent=s;t.style.display='block';setTimeout(()=>t.style.display='none',1600)}
function renderHome(){
 document.getElementById('homeView').style.display='block';document.getElementById('editorView').style.display='none';document.getElementById('bottom').style.display='none';
 document.getElementById('count').textContent=programs.length+' programa'+(programs.length===1?'':'s')+' guardado'+(programs.length===1?'':'s');
 let p=document.getElementById('programs');
 if(!programs.length){p.innerHTML='<div class="empty">Todavía no tienes programas.<br><br><button class="primary" onclick="newProgram()">＋ Crear primer programa</button></div>';return}
 p.innerHTML=programs.slice().sort((a,b)=>(b.updated||0)-(a.updated||0)).map(x=>`<article class="program-card"><div class="brand">${esc(x.program||'PROGRAMA')}</div><h3>${esc(x.client||'Sin nombre')}</h3><div class="muted">${esc(x.objective||'Sin objetivo')} · ${x.weeks?.length||0} semana(s)</div><div class="actions"><button class="primary" onclick="openProgram('${x.id}')">Abrir</button><button onclick="duplicateProgram('${x.id}')">Duplicar</button><button class="danger" onclick="deleteProgram('${x.id}')">Eliminar</button></div></article>`).join('');
}
function newProgram(){data=blankProgram();editingId=data.id;currentWeek=0;current=0;showEditor()}
function openProgram(id){let x=programs.find(p=>p.id===id);if(!x)return;data=normalizeProgram(clone(x));editingId=id;currentWeek=0;current=0;showEditor()}
function duplicateProgram(id){let x=programs.find(p=>p.id===id);if(!x)return;let y=clone(x);y.id=uid();y.client=(y.client||'Cliente')+' · copia';y.updated=Date.now();programs.push(y);persist();renderHome();toast('Programa duplicado')}
function deleteProgram(id){let x=programs.find(p=>p.id===id);if(!x||!confirm('¿Eliminar el programa de '+(x.client||'este cliente')+'?'))return;programs=programs.filter(p=>p.id!==id);persist();renderHome()}
function goHome(){if(data&&confirm('¿Guardar los cambios antes de volver?'))saveProgram(false);data=null;editingId=null;renderHome()}
function showEditor(){document.getElementById('homeView').style.display='none';document.getElementById('editorView').style.display='block';document.getElementById('bottom').style.display='flex';initMeta();render()}
function syncMeta(){['client','objective','program','frequency','start','note'].forEach(k=>data[k]=document.getElementById(k).value)}
function initMeta(){['client','objective','program','frequency','start','note'].forEach(k=>document.getElementById(k).value=data[k]||'')}
function saveProgram(show=true){syncMeta();data.id=editingId||data.id||uid();data.updated=Date.now();editingId=data.id;let i=programs.findIndex(p=>p.id===data.id);if(i>=0)programs[i]=clone(data);else programs.push(clone(data));persist();if(show)toast('Programa guardado')}
function render(){
 let wt=document.getElementById('weektabs'),tabs=document.getElementById('tabs'),ed=document.getElementById('editor');
 wt.innerHTML=data.weeks.map((w,i)=>`<button class="weektab ${i===currentWeek?'active':''}" onclick="currentWeek=${i};current=0;render()">${esc(w.title||('SEMANA '+(i+1)))}</button>`).join('');
 let ds=days();
 tabs.innerHTML=ds.map((d,i)=>`<button class="daytab ${i===current?'active':''}" onclick="current=${i};render()">DÍA ${i+1}</button>`).join('');
 if(!ds.length){ed.innerHTML='<div class="empty">Esta semana todavía no tiene días.<br><br><button onclick="addDay()">＋ Agregar día</button></div>';return}
 let d=ds[current];
 ed.innerHTML=`<div class="daytop"><input value="${esc(d.title)}" oninput="days()[current].title=this.value"></div>`+d.blocks.map((b,bi)=>blockHTML(b,bi)).join('')
}
function blockHTML(b,bi){return `<div class="block ${b.type==='mobility'?'mob':''}"><div class="blockhead"><input value="${esc(b.title)}" oninput="days()[current].blocks[${bi}].title=this.value"><div class="actions"><button onclick="addExercise(${bi})">＋ Ej.</button><button class="danger" onclick="deleteBlock(${bi})">×</button></div></div>${b.exercises.map((e,ei)=>exerciseHTML(e,bi,ei)).join('')}<div class="addrow"><button onclick="addExercise(${bi})">＋ Agregar ejercicio</button></div></div>`}
function exerciseHTML(e,bi,ei){let f=(key,label,cls='')=>`<div class="field ${cls}"><label>${label}</label><input value="${esc(e[key])}" oninput="days()[current].blocks[${bi}].exercises[${ei}].${key}=this.value"></div>`;return `<div class="exercise"><div class="grid">${f('name','EJERCICIO','name')}${f('sets','SERIES')}${f('reps','REPS / TIEMPO / CARGA')}${f('intensity','RIR / RPE / INTENSIDAD')}${f('rest','DESCANSO')}${f('cue','INDICACIÓN','cue')}${f('video','VIDEO YOUTUBE','video')}</div><div class="exactions"><button onclick="moveExercise(${bi},${ei},-1)">↑</button><button onclick="moveExercise(${bi},${ei},1)">↓</button><button class="danger" onclick="deleteExercise(${bi},${ei})">Quitar</button></div></div>`}
function blankEx(){return{name:'',sets:'',reps:'',intensity:'',rest:'',cue:'',video:''}}
function addExercise(bi){days()[current].blocks[bi].exercises.push(blankEx());render()}
function deleteExercise(bi,ei){days()[current].blocks[bi].exercises.splice(ei,1);render()}
function moveExercise(bi,ei,dir){let a=days()[current].blocks[bi].exercises,n=ei+dir;if(n<0||n>=a.length)return;[a[ei],a[n]]=[a[n],a[ei]];render()}
function addBlock(type){if(!days().length)addDay();days()[current].blocks.push({title:type==='mobility'?'MOVILIDAD ACTIVA · INICIO':'NUEVO BLOQUE',type,exercises:[blankEx()]});render()}
function deleteBlock(bi){days()[current].blocks.splice(bi,1);render()}
function addDay(){days().push({title:`DÍA ${days().length+1}`,blocks:[]});current=days().length-1;render()}
function duplicateDay(){if(!days().length)return;let c=clone(days()[current]);c.title=`DÍA ${days().length+1} · ${c.title.replace(/^DÍA\s*\d+\s*·?\s*/i,'')}`;days().splice(current+1,0,c);current++;render()}
function deleteDay(){if(!days().length||!confirm('¿Eliminar este día?'))return;days().splice(current,1);current=Math.max(0,Math.min(current,days().length-1));render()}
function addWeek(){
 let mode=confirm('¿Quieres DUPLICAR la semana actual?\n\nAceptar = duplicar semana actual\nCancelar = crear semana en blanco');
 let w=mode?clone(week()):{title:'',days:[]};
 w.title='SEMANA '+(data.weeks.length+1);
 data.weeks.splice(currentWeek+1,0,w);currentWeek++;current=0;render();toast(mode?'Semana duplicada':'Semana nueva creada')
}
function duplicateWeek(){let w=clone(week());w.title='SEMANA '+(data.weeks.length+1);data.weeks.splice(currentWeek+1,0,w);currentWeek++;current=0;render();toast('Semana duplicada')}
function deleteWeek(){if(data.weeks.length===1){alert('El programa debe conservar al menos una semana.');return}if(!confirm('¿Eliminar esta semana completa?'))return;data.weeks.splice(currentWeek,1);currentWeek=Math.max(0,Math.min(currentWeek,data.weeks.length-1));current=0;render()}
function clientHTML(){
 syncMeta();
 let selectors=[], weekTabs=[], panels=[], rules=[];
 data.weeks.forEach((w,wi)=>{
   selectors.push(`<input class="sel" type="radio" name="week" id="w${wi}" ${wi===0?'checked':''}>`);
   weekTabs.push(`<label class="tab weektabc" for="w${wi}">${esc(w.title||('SEMANA '+(wi+1)))}</label>`);
   rules.push(`#w${wi}:checked~.nav label[for=w${wi}]{background:#c98f78;color:white}`,`#w${wi}:checked~.program .wp${wi}{display:block}`);
   let daySelectors=[], dayTabs=[], dayPanels=[];
   w.days.forEach((d,di)=>{
     daySelectors.push(`<input class="sel" type="radio" name="day${wi}" id="w${wi}d${di}" ${di===0?'checked':''}>`);
     dayTabs.push(`<label class="tab" for="w${wi}d${di}">DÍA ${di+1}</label>`);
     rules.push(`#w${wi}d${di}:checked~.daysnav label[for=w${wi}d${di}]{background:#527d91;color:white}`,`#w${wi}d${di}:checked~.daypanels .dp${wi}_${di}{display:block}`);
     let bs=d.blocks.map(b=>`<div class="block ${b.type==='mobility'?'mob':''}"><div class="bh">${esc(b.title)}</div><div class="ex head"><div>Ejercicio</div><div>Series</div><div>Reps / carga</div><div>Intensidad</div><div>Descanso</div><div>Indicación</div><div>Video</div></div>`+b.exercises.filter(e=>Object.values(e).some(v=>String(v).trim())).map(e=>`<div class="ex"><div class="wide" data-l="EJERCICIO">${esc(e.name)}</div><div data-l="SERIES">${esc(e.sets)}</div><div data-l="REPS / CARGA">${esc(e.reps)}</div><div data-l="INTENSIDAD">${esc(e.intensity)}</div><div data-l="DESCANSO">${esc(e.rest)}</div><div class="wide" data-l="INDICACIÓN">${esc(e.cue)}</div><div class="wide vid" data-l="VIDEO">${e.video?`<a href="${esc(e.video)}" target="_blank">▶ VER VIDEO</a>`:''}</div></div>`).join('')+`</div>`).join('');
     dayPanels.push(`<div class="daypanel dp${wi}_${di}"><div class="dayhead"><h2>${esc(d.title)}</h2></div>${bs}</div>`);
   });
   panels.push(`<section class="weekpanel wp${wi}">${daySelectors.join('')}<div class="daysnav"><div class="sectionlabel">SELECCIONA TU DÍA</div><div class="tabs">${dayTabs.join('')}</div></div><div class="daypanels">${dayPanels.join('')}</div></section>`);
 });
 const css=`*{box-sizing:border-box}body{margin:0;background:#f6f3ef;font-family:Arial;color:#24313a}.app{max-width:1000px;margin:auto;padding:14px}.hero,.nav,.block,.note,.daysnav{background:#fffdfb;border:1px solid #e7ded6;border-radius:20px}.hero{padding:22px;background:linear-gradient(135deg,#fffdfb,#f8eeea)}.brand{font-size:11px;letter-spacing:.2em;font-weight:bold;color:#c98f78}h1{margin:6px 0}.sub{color:#71808a;font-size:13px}.info{display:grid;grid-template-columns:1.5fr repeat(4,1fr);gap:8px;margin-top:16px}.cell{border:1px solid #e7ded6;border-radius:11px;padding:9px}.cell small{display:block;color:#71808a;font-size:9px;margin-bottom:4px}.sel{position:absolute;left:-9999px}.nav{margin:14px 0;padding:14px}.tabs{display:flex;gap:7px;overflow:auto;margin-top:8px}.tab{padding:10px 13px;background:#eee7df;border-radius:11px;font-size:11px;font-weight:bold;white-space:nowrap}.weekpanel,.daypanel{display:none}.daysnav{padding:12px;margin-bottom:12px}.sectionlabel{font-size:9px;font-weight:bold;color:#71808a;letter-spacing:.1em}.dayhead{margin:18px 2px 9px}.dayhead h2{font-size:21px}.block{overflow:hidden;margin:10px 0}.bh{padding:12px 14px;background:linear-gradient(90deg,#f0ddd4,#fff);font-size:12px;font-weight:bold}.mob .bh{background:linear-gradient(90deg,#dcebf0,#fff);color:#527d91}.ex{display:grid;grid-template-columns:1.4fr .5fr .9fr .7fr .8fr 1.3fr 1fr;border-top:1px solid #e7ded6}.ex>div{padding:9px 7px;border-right:1px solid #e7ded6;font-size:11px}.ex>div:last-child{border:0}.head{color:#71808a;font-size:9px}.vid a{color:#527d91;text-decoration:none;font-weight:bold}.note{padding:14px;margin-top:13px}.footer{text-align:center;color:#9aa4aa;font-size:9px;margin-top:18px}@media(max-width:700px){.info{grid-template-columns:1fr 1fr}.info .cell:first-child{grid-column:1/-1}.ex{grid-template-columns:1fr 1fr}.ex.head{display:none}.ex>div:before{content:attr(data-l);display:block;font-size:8px;color:#71808a;font-weight:bold}.ex .wide{grid-column:1/-1}}${rules.join('')}`;
 const meta=(lab,val)=>`<div class="cell"><small>${lab}</small><b>${esc(val)}</b></div>`;
 return `<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${esc(data.client)} — Training Luis Quirós</title><style>${css}</style></head><body><main class="app"><section class="hero"><div class="brand">PROGRAMA PERSONALIZADO</div><h1>TRAINING LUIS QUIRÓS</h1><div class="sub">${esc(data.program)} · ${esc(data.objective)}</div><div class="info">${meta('CLIENTE',data.client)}${meta('OBJETIVO',data.objective)}${meta('PROGRAMA',data.program)}${meta('FRECUENCIA',data.frequency)}${meta('INICIO',data.start)}</div></section>${selectors.join('')}<section class="nav"><div class="sectionlabel">SELECCIONA TU SEMANA</div><div class="tabs">${weekTabs.join('')}</div><div class="note"><b>Observación general:</b> ${esc(data.note)}</div></section><section class="program">${panels.join('')}</section><div class="footer">TRAINING LUIS QUIRÓS</div></main></body></html>`
}
