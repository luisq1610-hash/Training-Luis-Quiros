<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Creador · Training Luis Quirós</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f3ef;color:#24313a;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
.app{max-width:1100px;margin:auto;padding:14px 14px 100px}.hero,.toolbar,.card{background:#fffdfb;border:1px solid #e7ded6;border-radius:20px}
.hero{padding:20px;background:linear-gradient(135deg,#fffdfb,#f8eeea)}.brand{font-size:11px;letter-spacing:.18em;font-weight:800;color:#c98f78}h1{font-size:25px;margin:6px 0}.muted{color:#71808a;font-size:12px}
.meta{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:14px}.field label{display:block;font-size:9px;color:#71808a;font-weight:800;margin:0 0 4px 3px}

.toolbar{padding:10px;margin:12px 0;display:flex;gap:7px;overflow:auto;position:sticky;top:6px;z-index:10;box-shadow:0 5px 20px #0000000c}
button{border:0;border-radius:10px;padding:10px 12px;font-weight:750;font-size:11px;white-space:nowrap;background:#dcebf0;color:#527d91}
button.primary{background:#527d91;color:white}button.terra{background:#f0ddd4;color:#8d5e4d}button.danger{background:#f7e5e5;color:#9b5151}
.daytabs{display:flex;gap:7px;overflow:auto;margin:12px 0}.daytab.active{background:#527d91;color:white}
.daytop{display:flex;gap:8px;align-items:center;margin:16px 0 9px}.daytop input{font-size:18px;font-weight:800}.daytop .actions{display:flex;gap:5px}
.block{background:#fffdfb;border:1px solid #e7ded6;border-radius:18px;overflow:hidden;margin:10px 0}.block.mob{border-color:#cddfe6}
.blockhead{display:flex;gap:8px;align-items:center;padding:10px;background:linear-gradient(90deg,#f0ddd4,#fff)}.mob .blockhead{background:linear-gradient(90deg,#dcebf0,#fff)}
.blockhead input{font-weight:800;background:transparent;border:0;padding:4px}.blockhead .actions{display:flex;gap:4px}
.exercise{padding:10px;border-top:1px solid #e7ded6}.grid{display:grid;grid-template-columns:1.3fr .45fr .8fr .65fr .8fr 1.2fr;gap:6px}.grid .video{grid-column:1/-1}
.exactions{display:flex;justify-content:flex-end;gap:5px;margin-top:7px}.addrow{padding:10px}.bottom{position:fixed;bottom:0;left:0;right:0;background:#fffdfbf2;border-top:1px solid #e7ded6;padding:9px 14px calc(9px + env(safe-area-inset-bottom));display:flex;justify-content:center;gap:8px;z-index:20}

@media(max-width:720px){.meta{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr 1fr}.grid .name,.grid .cue,.grid .video{grid-column:1/-1}.daytop{align-items:flex-start;flex-direction:column}.daytop input{font-size:16px}.blockhead{align-items:flex-start}.blockhead .actions{margin-left:auto}.hide-mobile{display:none}}
</style></head><body><main class="app">
<section class="hero"><div class="brand">CREADOR DE PROGRAMAS</div><h1>TRAINING LUIS QUIRÓS</h1><div class="muted">Edita, agrega, elimina, duplica y guarda. Este archivo inicia con el programa de Mónica.</div>
<div class="meta">
<div class="field"><label>CLIENTE</label><input id="client"></div><div class="field"><label>OBJETIVO</label><input id="objective"></div>
<div class="field"><label>PROGRAMA</label><input id="program"></div><div class="field"><label>FRECUENCIA</label><input id="frequency"></div>
<div class="field"><label>INICIO</label><input id="start"></div><div class="field"><label>OBSERVACIÓN GENERAL</label><input id="note"></div>
</div></section>
<section class="toolbar"><button onclick="addDay()">＋ Día</button><button onclick="addBlock('mobility')">＋ Movilidad</button><button onclick="addBlock('normal')">＋ Bloque</button><button onclick="duplicateDay()">⧉ Duplicar día</button><button class="danger" onclick="deleteDay()">Eliminar día</button></section>
<div id="tabs" class="daytabs"></div><section id="editor"></section>
</main><div class="bottom"><button class="primary" onclick="save()">Guardar cambios</button><button class="terra" onclick="downloadClient()">Generar archivo cliente</button><button onclick="resetData()">Restaurar Mónica</button></div><div class="toast" id="toast"></div>
<script>
const ORIGINAL={"client": "Mónica Darnitsyne", "objective": "Masa muscular + postura", "program": "Programa inicial", "frequency": "5 días / semana", "start": "14 sep 2026", "note": "Hazle caso a Luis.", "days": [{"title": "DÍA 1 · FUERZA — SENTADILLA + PECHO", "blocks": [{"title": "MOVILIDAD ACTIVA · INICIO", "type": "mobility", "exercises": [{"name": "", "sets": "", "reps": "", "intensity": "", "rest": "", "cue": "", "video": ""}, {"name": "", "sets": "", "reps": "", "intensity": "", "rest": "", "cue": "", "video": ""}, {"name": "", "sets": "", "reps": "", "intensity": "", "rest": "", "cue": "", "video": ""}, {"name": "", "sets": "", "reps": "", "intensity": "", "rest": "", "cue": "", "video": ""}]}, {"title": "MÉTODO DE FUERZA", "type": "normal", "exercises": [{"name": "Sentadilla · secuencia", "sets": "1", "reps": "3×5 lb → 1×15 lb → 2×10 lb", "intensity": "—", "rest": "Por sensaciones", "cue": "Buena técnica.", "video": ""}, {"name": "Sentadilla", "sets": "3", "reps": "5 reps · 25 lb", "intensity": "—", "rest": "Por sensaciones", "cue": "Controlar el movimiento.", "video": "https://youtu.be/okUCXiGCESA?si=j9EloVCIcXgqFUQz"}]}, {"title": "HIPERTROFIA · 3 RONDAS", "type": "normal", "exercises": [{"name": "Press de pecho", "sets": "3", "reps": "10 reps", "intensity": "RIR 2", "rest": "Por sensaciones", "cue": "Seguido del press cerrado.", "video": ""}, {"name": "Press cerrado con KB", "sets": "3", "reps": "8 reps · 25 lb", "intensity": "—", "rest": "Por sensaciones", "cue": "", "video": ""}]}, {"title": "FINAL", "type": "normal", "exercises": [{"name": "Sentadilla isométrica", "sets": "3", "reps": "20–30 s", "intensity": "—", "rest": "Por sensaciones", "cue": "", "video": ""}]}]}, {"title": "DÍA 2 · PESO MUERTO + HOMBRO + CARDIO", "blocks": [{"title": "MOVILIDAD ACTIVA · INICIO", "type": "mobility", "exercises": [{"name": "", "sets": "", "reps": "", "intensity": "", "rest": "", "cue": "", "video": ""}, {"name": "", "sets": "", "reps": "", "intensity": "", "rest": "", "cue": "", "video": ""}, {"name": "", "sets": "", "reps": "", "intensity": "", "rest": "", "cue": "", "video": ""}, {"name": "", "sets": "", "reps": "", "intensity": "", "rest": "", "cue": "", "video": ""}]}, {"title": "FUERZA · 3 RONDAS", "type": "normal", "exercises": [{"name": "Peso muerto con KB", "sets": "3", "reps": "8 reps · 25 lb", "intensity": "—", "rest": "Por sensaciones", "cue": "", "video": ""}, {"name": "Curl martillo + press de hombro", "sets": "3", "reps": "12 reps", "intensity": "—", "rest": "Por sensaciones", "cue": "1 rep = curl martillo + press completo.", "video": ""}]}, {"title": "CARDIO", "type": "normal", "exercises": [{"name": "Escaladora", "sets": "—", "reps": "Libre", "intensity": "Libre", "rest": "Por sensaciones", "cue": "", "video": ""}]}]}, {"title": "DÍA 3 · CORE + CONTROL PÉLVICO + POSTURA", "blocks": [{"title": "MOVILIDAD ACTIVA · INICIO", "type": "mobility", "exercises": [{"name": "", "sets": "", "reps": "", "intensity": "", "rest": "", "cue": "", "video": ""}, {"name": "", "sets": "", "reps": "", "intensity": "", "rest": "", "cue": "", "video": ""}, {"name": "", "sets": "", "reps": "", "intensity": "", "rest": "", "cue": "", "video": ""}, {"name": "", "sets": "", "reps": "", "intensity": "", "rest": "", "cue": "", "video": ""}]}, {"title": "CONTROL PÉLVICO · 3 RONDAS", "type": "normal", "exercises": [{"name": "Retroversión pélvica en suelo", "sets": "3", "reps": "10 reps · pausa 3 s", "intensity": "Control", "rest": "Por sensaciones", "cue": "Retroversión consciente.", "video": ""}, {"name": "Dead bug", "sets": "3", "reps": "8 por lado", "intensity": "Control", "rest": "Por sensaciones", "cue": "Control lumbar.", "video": ""}, {"name": "Elevación pélvica", "sets": "3", "reps": "10 reps · pausa 3 s", "intensity": "Control", "rest": "Por sensaciones", "cue": "Buena posición de pelvis.", "video": ""}]}, {"title": "MOVILIDAD + POSTURA · 3 RONDAS", "type": "normal", "exercises": [{"name": "Estiramiento iliopsoas en desplante + posterior pelvic tilt", "sets": "3", "reps": "30 s por lado", "intensity": "Control", "rest": "Por sensaciones", "cue": "Mantener retroversión durante el estiramiento.", "video": ""}, {"name": "Plancha de Isi + respiración", "sets": "3", "reps": "5 respiraciones", "intensity": "Control", "rest": "Por sensaciones", "cue": "Controlar pelvis y caja torácica.", "video": ""}]}, {"title": "CUELLO + POSTURA", "type": "normal", "exercises": [{"name": "Chin tucks", "sets": "3", "reps": "8–10 reps · 5 s", "intensity": "Suave", "rest": "Por sensaciones", "cue": "Controlado.", "video": ""}, {"name": "Isométrico cervical frontal y laterales", "sets": "3", "reps": "15–20 s / dirección", "intensity": "Suave", "rest": "Por sensaciones", "cue": "Sin forzar.", "video": ""}, {"name": "Wall slides", "sets": "3", "reps": "10–12 reps", "intensity": "Control", "rest": "Por sensaciones", "cue": "Priorizar postura.", "video": ""}]}]}, {"title": "DÍA 4 · REPITE DÍA 1", "blocks": [{"title": "MOVILIDAD ACTIVA · INICIO", "type": "mobility", "exercises": [{"name": "", "sets": "", "reps": "", "intensity": "", "rest": "", "cue": "", "video": ""}, {"name": "", "sets": "", "reps": "", "intensity": "", "rest": "", "cue": "", "video": ""}, {"name": "", "sets": "", "reps": "", "intensity": "", "rest": "", "cue": "", "video": ""}, {"name": "", "sets": "", "reps": "", "intensity": "", "rest": "", "cue": "", "video": ""}]}, {"title": "MÉTODO DE FUERZA", "type": "normal", "exercises": [{"name": "Sentadilla · secuencia", "sets": "1", "reps": "3×5 lb → 1×15 lb → 2×10 lb", "intensity": "—", "rest": "Por sensaciones", "cue": "Buena técnica.", "video": ""}, {"name": "Sentadilla", "sets": "3", "reps": "5 reps · 25 lb", "intensity": "—", "rest": "Por sensaciones", "cue": "Controlar el movimiento.", "video": "https://youtu.be/okUCXiGCESA?si=j9EloVCIcXgqFUQz"}]}, {"title": "HIPERTROFIA · 3 RONDAS", "type": "normal", "exercises": [{"name": "Press de pecho", "sets": "3", "reps": "10 reps", "intensity": "RIR 2", "rest": "Por sensaciones", "cue": "Seguido del press cerrado.", "video": ""}, {"name": "Press cerrado con KB", "sets": "3", "reps": "8 reps · 25 lb", "intensity": "—", "rest": "Por sensaciones", "cue": "", "video": ""}]}, {"title": "FINAL", "type": "normal", "exercises": [{"name": "Sentadilla isométrica", "sets": "3", "reps": "20–30 s", "intensity": "—", "rest": "Por sensaciones", "cue": "", "video": ""}]}]}, {"title": "DÍA 5 · REPITE DÍA 2", "blocks": [{"title": "MOVILIDAD ACTIVA · INICIO", "type": "mobility", "exercises": [{"name": "", "sets": "", "reps": "", "intensity": "", "rest": "", "cue": "", "video": ""}, {"name": "", "sets": "", "reps": "", "intensity": "", "rest": "", "cue": "", "video": ""}, {"name": "", "sets": "", "reps": "", "intensity": "", "rest": "", "cue": "", "video": ""}, {"name": "", "sets": "", "reps": "", "intensity": "", "rest": "", "cue": "", "video": ""}]}, {"title": "FUERZA · 3 RONDAS", "type": "normal", "exercises": [{"name": "Peso muerto con KB", "sets": "3", "reps": "8 reps · 25 lb", "intensity": "—", "rest": "Por sensaciones", "cue": "", "video": ""}, {"name": "Curl martillo + press de hombro", "sets": "3", "reps": "12 reps", "intensity": "—", "rest": "Por sensaciones", "cue": "1 rep = curl martillo + press completo.", "video": ""}]}, {"title": "CARDIO", "type": "normal", "exercises": [{"name": "Escaladora", "sets": "—", "reps": "Libre", "intensity": "Libre", "rest": "Por sensaciones", "cue": "", "video": ""}]}]}]};
let data=JSON.parse(localStorage.getItem('tlq_program')||'null')||structuredClone(ORIGINAL), current=0;
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function syncMeta(){['client','objective','program','frequency','start','note'].forEach(k=>data[k]=document.getElementById(k).value)}
function initMeta(){['client','objective','program','frequency','start','note'].forEach(k=>document.getElementById(k).value=data[k]||'')}
function toast(s){let t=document.getElementById('toast');t.textContent=s;t.style.display='block';setTimeout(()=>t.style.display='none',1400)}
function render(){
 let tabs=document.getElementById('tabs'); tabs.innerHTML=data.days.map((d,i)=>`<button class="daytab ${i===current?'active':''}" onclick="current=${i};render()">DÍA ${i+1}</button>`).join('');
 if(!data.days.length){document.getElementById('editor').innerHTML='<div class="card" style="padding:20px">Agrega un día para comenzar.</div>';return}
 let d=data.days[current];
 document.getElementById('editor').innerHTML=`<div class="daytop"><input value="${esc(d.title)}" oninput="data.days[current].title=this.value"><div class="actions"><button onclick="duplicateDay()">⧉ Duplicar</button></div></div>`+
 d.blocks.map((b,bi)=>blockHTML(b,bi)).join('');
}
function blockHTML(b,bi){return `<div class="block ${b.type==='mobility'?'mob':''}"><div class="blockhead"><input value="${esc(b.title)}" oninput="data.days[current].blocks[${bi}].title=this.value"><div class="actions"><button onclick="addExercise(${bi})">＋ Ej.</button><button class="danger" onclick="deleteBlock(${bi})">×</button></div></div>${b.exercises.map((e,ei)=>exerciseHTML(e,bi,ei)).join('')}<div class="addrow"><button onclick="addExercise(${bi})">＋ Agregar ejercicio</button></div></div>`}
function exerciseHTML(e,bi,ei){let f=(key,label,cls='')=>`<div class="field ${cls}"><label>${label}</label><input value="${esc(e[key])}" oninput="data.days[current].blocks[${bi}].exercises[${ei}].${key}=this.value"></div>`;
return `<div class="exercise"><div class="grid">${f('name','EJERCICIO','name')}${f('sets','SERIES')}${f('reps','REPS / TIEMPO / CARGA')}${f('intensity','RIR / RPE / INTENSIDAD')}${f('rest','DESCANSO')}${f('cue','INDICACIÓN','cue')}${f('video','VIDEO YOUTUBE','video')}</div><div class="exactions"><button onclick="moveExercise(${bi},${ei},-1)">↑</button><button onclick="moveExercise(${bi},${ei},1)">↓</button><button class="danger" onclick="deleteExercise(${bi},${ei})">Quitar</button></div></div>`}
function blankEx(){return{name:'',sets:'',reps:'',intensity:'',rest:'',cue:'',video:''}}
function addExercise(bi){data.days[current].blocks[bi].exercises.push(blankEx());render()}
function deleteExercise(bi,ei){data.days[current].blocks[bi].exercises.splice(ei,1);render()}
function moveExercise(bi,ei,dir){let a=data.days[current].blocks[bi].exercises,n=ei+dir;if(n<0||n>=a.length)return;[a[ei],a[n]]=[a[n],a[ei]];render()}
function addBlock(type){if(!data.days.length)addDay();data.days[current].blocks.push({title:type==='mobility'?'MOVILIDAD ACTIVA · INICIO':'NUEVO BLOQUE',type:type,exercises:[blankEx()]});render()}
function deleteBlock(bi){data.days[current].blocks.splice(bi,1);render()}
function addDay(){data.days.push({title:`DÍA ${data.days.length+1}`,blocks:[]});current=data.days.length-1;render()}
function duplicateDay(){if(!data.days.length)return;let c=structuredClone(data.days[current]);c.title=`DÍA ${data.days.length+1} · ${c.title.replace(/^DÍA\s*\d+\s*·?\s*/i,'')}`;data.days.splice(current+1,0,c);current++;render()}
function deleteDay(){if(!data.days.length)return;if(!confirm('¿Eliminar este día?'))return;data.days.splice(current,1);current=Math.max(0,Math.min(current,data.days.length-1));render()}
function save(){syncMeta();localStorage.setItem('tlq_program',JSON.stringify(data));toast('Programa guardado en este navegador')}
function resetData(){if(!confirm('¿Restaurar el programa original de Mónica?'))return;data=structuredClone(ORIGINAL);current=0;initMeta();save();render()}
function clientHTML(){
 syncMeta();
 const css=`*{box-sizing:border-box}body{margin:0;background:#f6f3ef;font-family:Arial;color:#24313a}.app{max-width:1000px;margin:auto;padding:14px}.hero,.nav,.block,.note{background:#fffdfb;border:1px solid #e7ded6;border-radius:20px}.hero{padding:22px;background:linear-gradient(135deg,#fffdfb,#f8eeea)}.brand{font-size:11px;letter-spacing:.2em;font-weight:bold;color:#c98f78}h1{margin:6px 0}.sub{color:#71808a;font-size:13px}.info{display:grid;grid-template-columns:1.5fr repeat(4,1fr);gap:8px;margin-top:16px}.cell{border:1px solid #e7ded6;border-radius:11px;padding:9px}.cell small{display:block;color:#71808a;font-size:9px;margin-bottom:4px}.sel{position:absolute;left:-9999px}.nav{margin:14px 0;padding:14px}.tabs{display:flex;gap:7px;overflow:auto}.tab{padding:10px 13px;background:#eee7df;border-radius:11px;font-size:11px;font-weight:bold;white-space:nowrap}.panel{display:none}.dayhead{margin:18px 2px 9px}.dayhead h2{font-size:21px}.block{overflow:hidden;margin:10px 0}.bh{padding:12px 14px;background:linear-gradient(90deg,#f0ddd4,#fff);font-size:12px;font-weight:bold}.mob .bh{background:linear-gradient(90deg,#dcebf0,#fff);color:#527d91}.ex{display:grid;grid-template-columns:1.4fr .5fr .9fr .7fr .8fr 1.3fr 1fr;border-top:1px solid #e7ded6}.ex>div{padding:9px 7px;border-right:1px solid #e7ded6;font-size:11px}.ex>div:last-child{border:0}.head{color:#71808a;font-size:9px}.vid a{color:#527d91;text-decoration:none;font-weight:bold}.note{padding:14px;margin-top:13px}.footer{text-align:center;color:#9aa4aa;font-size:9px;margin-top:18px}@media(max-width:700px){.info{grid-template-columns:1fr 1fr}.info .cell:first-child{grid-column:1/-1}.ex{grid-template-columns:1fr 1fr}.ex.head{display:none}.ex>div:before{content:attr(data-l);display:block;font-size:8px;color:#71808a;font-weight:bold}.ex .wide{grid-column:1/-1}}`+
 data.days.map((_,i)=>`#d${i+1}:checked~.nav label[for=d${i+1}]{background:#527d91;color:white}#d${i+1}:checked~.program .p${i+1}{display:block}`).join('');
 const meta=(lab,val)=>`<div class="cell"><small>${lab}</small><b>${esc(val)}</b></div>`;
 const blocks=data.days.map((d,di)=>`<div class="panel p${di+1}"><div class="dayhead"><h2>${esc(d.title)}</h2></div>`+d.blocks.map(b=>`<div class="block ${b.type==='mobility'?'mob':''}"><div class="bh">${esc(b.title)}</div><div class="ex head"><div>Ejercicio</div><div>Series</div><div>Reps / carga</div><div>Intensidad</div><div>Descanso</div><div>Indicación</div><div>Video</div></div>`+b.exercises.filter(e=>Object.values(e).some(v=>String(v).trim())).map(e=>`<div class="ex"><div class="wide" data-l="EJERCICIO">${esc(e.name)}</div><div data-l="SERIES">${esc(e.sets)}</div><div data-l="REPS / CARGA">${esc(e.reps)}</div><div data-l="INTENSIDAD">${esc(e.intensity)}</div><div data-l="DESCANSO">${esc(e.rest)}</div><div class="wide" data-l="INDICACIÓN">${esc(e.cue)}</div><div class="wide vid" data-l="VIDEO">${e.video?`<a href="${esc(e.video)}" target="_blank">▶ VER VIDEO</a>`:''}</div></div>`).join('')+`</div>`).join('')+`</div>`).join('');
 return `<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${esc(data.client)} — Training Luis Quirós</title><style>${css}</style></head><body><main class="app"><section class="hero"><div class="brand">PROGRAMA PERSONALIZADO</div><h1>TRAINING LUIS QUIRÓS</h1><div class="sub">${esc(data.program)} · ${esc(data.objective)}</div><div class="info">${meta('CLIENTE',data.client)}${meta('OBJETIVO',data.objective)}${meta('PROGRAMA',data.program)}${meta('FRECUENCIA',data.frequency)}${meta('INICIO',data.start)}</div></section>`+data.days.map((_,i)=>`<input class="sel" type="radio" name="day" id="d${i+1}" ${i===0?'checked':''}>`).join('')+`<section class="nav"><b style="font-size:10px;color:#71808a">SELECCIONA TU ENTRENAMIENTO</b><div class="tabs" style="margin-top:8px">${data.days.map((_,i)=>`<label class="tab" for="d${i+1}">DÍA ${i+1}</label>`).join('')}</div><div class="note"><b>Observación general:</b> ${esc(data.note)}</div></section><section class="program">${blocks}</section><div class="footer">TRAINING LUIS QUIRÓS</div></main></body></html>`
}
function downloadClient(){save();let blob=new Blob([clientHTML()],{type:'text/html;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=(data.client||'Cliente').replace(/[^\p{L}\p{N}]+/gu,'_')+'_Training_Luis_Quiros.html';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('Archivo del cliente generado')}
initMeta();render();
</script></body></html>
